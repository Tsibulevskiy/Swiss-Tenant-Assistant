<svg width="720" height="560" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Swiss Tenant Assistant protection illustration</title>
  <desc id="desc">Green shield with check mark in front of rental documents and checklist cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFA"/>
      <stop offset="1" stop-color="#EDF7F1"/>
    </linearGradient>
    <linearGradient id="green" x1="250" y1="95" x2="410" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#149447"/>
      <stop offset="1" stop-color="#057B36"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFF5E8"/>
      <stop offset="1" stop-color="#F7FCF9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B6B37" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="560" rx="36" fill="url(#bg)"/>

  <!-- Decorative background -->
  <ellipse cx="360" cy="430" rx="185" ry="36" fill="#0B8A3B" opacity="0.08"/>
  <circle cx="139" cy="195" r="9" fill="#15803D" opacity="0.18"/>
  <circle cx="545" cy="126" r="6" fill="#15803D" opacity="0.18"/>
  <path d="M552 162V132M537 147H567" stroke="#108B3E" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M194 95C198 103 204 108 213 112C204 116 198 121 194 129C190 121 184 116 175 112C184 108 190 103 194 95Z" fill="#108B3E" opacity="0.14"/>

  <!-- Left document card -->
  <g filter="url(#cardShadow)" transform="rotate(-9 214 305)">
    <rect x="86" y="250" width="218" height="144" rx="20" fill="white" stroke="#D9E8DE" stroke-width="2"/>
    <rect x="116" y="282" width="45" height="45" rx="10" fill="url(#greenSoft)"/>
    <path d="M128 297H149M128 308H144M128 319H151" stroke="#108B3E" stroke-width="5" stroke-linecap="round"/>
    <path d="M185 288H260M185 314H260M185 340H238" stroke="#C9D8CF" stroke-width="9" stroke-linecap="round"/>
    <rect x="116" y="346" width="54" height="14" rx="7" fill="#108B3E" opacity="0.12"/>
    <rect x="116" y="367" width="82" height="14" rx="7" fill="#108B3E" opacity="0.08"/>
  </g>

  <!-- Right checklist card -->
  <g filter="url(#cardShadow)" transform="rotate(7 506 312)">
    <rect x="424" y="246" width="208" height="154" rx="20" fill="white" stroke="#D9E8DE" stroke-width="2"/>
    <path d="M460 292H566M460 329H566" stroke="#C9D8CF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="442" cy="292" r="14" fill="#E7F7EE"/>
    <path d="M435 292L440 297L450 286" stroke="#108B3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="442" cy="329" r="14" fill="#E7F7EE"/>
    <path d="M435 329L440 334L450 323" stroke="#108B3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="462" y="358" width="82" height="14" rx="7" fill="#108B3E" opacity="0.1"/>
  </g>

  <!-- Small tenant/payment card -->
  <g filter="url(#cardShadow)" transform="rotate(-6 245 356)">
    <rect x="188" y="347" width="122" height="80" rx="16" fill="white" stroke="#D9E8DE" stroke-width="2"/>
    <rect x="207" y="370" width="32" height="24" rx="6" fill="#108B3E"/>
    <path d="M215 382H231" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 374H285M252 392H278" stroke="#C9D8CF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Main shield -->
  <g filter="url(#shadow)">
    <path d="M360 84C409 120 458 133 505 135V226C505 304 457 367 360 416C263 367 215 304 215 226V135C262 133 311 120 360 84Z" fill="url(#green)"/>
    <path d="M360 108C400 136 443 149 482 152V225C482 289 444 341 360 385C276 341 238 289 238 225V152C277 149 320 136 360 108Z" stroke="white" stroke-opacity="0.22" stroke-width="8"/>
    <path d="M302 243L345 286L425 201" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tiny Swiss plus badge -->
  <g transform="translate(162 309)">
    <rect x="0" y="0" width="42" height="42" rx="12" fill="#108B3E"/>
    <path d="M21 10V32M10 21H32" stroke="white" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
